<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CM Merlin</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        -webkit-app-region: drag;
      }

      .stage {
        position: relative;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        height: 100%;
        padding: 0;
        animation: stage-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .sticker-wrap {
        position: relative;
        flex: 1;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        border-radius: 18px;
        overflow: hidden;
        box-shadow:
          0 0 0 3px rgb(255 255 255 / 0.14),
          0 28px 72px rgb(0 0 0 / 0.72);
        animation: sticker-pop 0.7s cubic-bezier(0.34, 1.45, 0.64, 1) 0.08s both;
      }

      .sticker-wrap.is-out {
        animation: sticker-out 0.42s cubic-bezier(0.55, 0, 1, 0.45) forwards;
      }

      .sticker {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
      }

      /* Holographic sweep — 90s foil sticker */
      .foil {
        position: absolute;
        inset: -40%;
        background: linear-gradient(
          105deg,
          transparent 38%,
          rgb(255 255 255 / 0.1) 44%,
          rgb(180 255 220 / 0.4) 48%,
          rgb(255 120 200 / 0.32) 52%,
          rgb(120 200 255 / 0.38) 56%,
          transparent 62%
        );
        transform: translateX(-120%) skewX(-12deg);
        animation: foil-sweep 1.35s ease-in-out 0.45s 2;
        pointer-events: none;
        mix-blend-mode: screen;
      }

      .sparkles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle at 18% 22%, rgb(255 255 255 / 0.95) 0 2px, transparent 4px),
          radial-gradient(circle at 72% 18%, rgb(255 220 120 / 0.9) 0 2.5px, transparent 5px),
          radial-gradient(circle at 84% 62%, rgb(160 255 200 / 0.85) 0 2px, transparent 4px),
          radial-gradient(circle at 28% 78%, rgb(255 160 220 / 0.8) 0 2.5px, transparent 5px),
          radial-gradient(circle at 55% 45%, rgb(255 255 255 / 0.75) 0 2px, transparent 4px);
        opacity: 0;
        animation: spark-twinkle 1.8s ease-in-out 0.5s infinite;
      }

      @keyframes stage-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes sticker-pop {
        from {
          opacity: 0;
          transform: scale(0.9) rotate(-2deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes sticker-out {
        to {
          opacity: 0;
          transform: scale(1.05) rotate(1deg);
        }
      }

      @keyframes foil-sweep {
        0% {
          transform: translateX(-120%) skewX(-12deg);
        }
        100% {
          transform: translateX(120%) skewX(-12deg);
        }
      }

      @keyframes spark-twinkle {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 0.75;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="sticker-wrap" id="wrap">
        <img class="sticker" alt="CM Merlin" />
        <div class="foil" aria-hidden="true"></div>
        <div class="sparkles" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      window.addEventListener('beforeunload', () => {
        const wrap = document.getElementById('wrap')
        if (wrap) wrap.classList.add('is-out')
      })
    </script>
  </body>
</html>
